spring.application.name=jobfinder-backend
server.address=${HOST:127.0.0.1}
server.port=${PORT:8000}
# X-SQL-Log can list many statements in one response header
server.max-http-response-header-size=64KB
spring.jackson.property-naming-strategy=SNAKE_CASE
# CV size limit is enforced in code (CV_MAX_BYTES); this is only the hard ceiling
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.web.resources.add-mappings=false
